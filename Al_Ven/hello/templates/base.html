{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SOPHISTICATED{% endblock %} | SOPHISTICATED</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="header"> 
      <div class="logo">
          <a href="{% url 'index' %}"><p>SOPHISTICATED</p></a>
      </div>
      <div class="menu"> 
          {% with current=request.resolver_match.url_name %}
          <a href="{% url 'index' %}"{% if current == 'index' %} class="active"{% endif %}>Главная</a>
          <a href="{% url 'news' %}"{% if current == 'news' %} class="active"{% endif %}>Персонал</a>
          <a href="{% url 'products' %}"{% if current == 'products' %} class="active"{% endif %}>Продукция</a>
          <a href="{% url 'blog' %}"{% if current == 'blog' %} class="active"{% endif %}>Наш блог</a>
          <a href="{% url 'weo' %}"{% if current == 'weo' %} class="active"{% endif %}>О нас</a>
          <a href="{% url 'vhod' %}"{% if current == 'vhod' or current == 'reg' %} class="active"{% endif %}>Вход</a>
          {% endwith %}
      </div> 
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    {% block footer %}© SOPHISTICATED{% endblock %}
  </footer>
</body>
</html>
