{% extends 'base.html' %}

{% block title %}РЕГИСТРАЦИЯ{% endblock %}

{% block content %}
<div class="content_form">

    <div>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="name" >Имя:</label>
        <input type="text" id="name" name="name", placeholder="Введите имя" required>

        <label for="pass">Пароль:</label>
        <input type="password" id="pass" name="pass" placeholder="Введите пароль" required>

        <label for="pass_confirm">Подтвердите пароль:</label>
        <input type="password" id="pass_confirm" name="pass_confirm" placeholder="Повторите пароль" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Введите email" required>
        <p> Есть акаунта? ➡ <a class='reg_but' href="{% url 'vhod' %}">ЗАХОДИ❕</a></p>
        <button type="submit">Отправить</button>
    </form>
    </div>
</div>
{% endblock %}

{% block footer %}<p>reg</p>{% endblock %}
